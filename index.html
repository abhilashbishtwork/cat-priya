<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priya's CAT Coach</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--ink2:#4b4a6b;--mut:#8a89a6;--bg:#f7f6fb;--card:#fff;--line:#e8e6f2;--acc:#f97316;--acc2:#fff1e6;--ok:#16a34a;--ok2:#e9f9ef;--bad:#dc2626;--bad2:#fdecec;--vio:#6d28d9;--vio2:#f1ebff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0}
a{color:var(--vio)}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd{font-weight:800;font-size:26px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cd small{font-size:12px;font-weight:600;opacity:.75;letter-spacing:0;margin-left:6px}
.pill{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fb923c,#facc15);border-radius:9px}
.barlbl{font-size:11px;opacity:.7;margin-top:4px;display:flex;justify-content:space-between}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
h1{font-size:24px;line-height:1.2;margin:4px 0 6px;letter-spacing:-.4px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 4px}
p{margin:0 0 10px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#312e81,#6d28d9);color:#fff;border:0}
.hero p{color:#e0dcff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;width:100%;font-size:15px}
.btn.sec{background:var(--vio2);color:var(--vio)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.task.done span{text-decoration:line-through;color:var(--mut)}
.secCard{display:flex;align-items:center;gap:12px;cursor:pointer}
.secIcon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.secCard .meta{flex:1;min-width:0}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.lvl{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--line);color:var(--mut);position:relative}
.lvl.open{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.35)}
.lvl.pass{background:var(--ok);color:#fff}
.lvl small{position:absolute;bottom:3px;font-size:9px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--vio2);color:var(--vio)}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.bad{background:var(--bad2);color:var(--bad)}.tag.acc{background:var(--acc2);color:#c2410c}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;padding:8px 0 10px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--ink)}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.timer.low{color:var(--bad)}
.stem{background:#fbfaff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;max-height:42vh;overflow:auto;margin-bottom:12px;color:var(--ink2)}
.qtext{font-weight:600;white-space:pre-wrap;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--ink)}
.opt.sel{border-color:var(--vio);background:var(--vio2)}
.opt.right{border-color:var(--ok);background:var(--ok2)}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.tita{width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
.exp{background:var(--acc2);border-radius:12px;padding:12px;font-size:14px;margin:8px 0}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dots button{width:30px;height:30px;border-radius:8px;background:var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.dots button.ans{background:var(--vio);color:#fff}.dots button.cur{outline:2px solid var(--acc)}
.row2{display:flex;gap:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,12,40,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.campus{border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#c7d2fe,#fbcfe8);aspect-ratio:16/9;display:grid;place-items:center;color:var(--ink);font-weight:800;margin-bottom:10px}
.campus img{width:100%;height:100%;object-fit:cover;display:block}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:13px;font-weight:700;text-decoration:none;background:var(--vio2);padding:6px 10px;border-radius:99px}
.pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:30px;font-weight:800;color:var(--ok);pointer-events:none;z-index:60;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-80px);opacity:0}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--acc)}
.muted{color:var(--mut);font-size:13px}
.center{text-align:center}
.move{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:0}
.move p{color:#ffedd5}.move .btn{background:#fff;color:#c2410c}
.verdict{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.verdict .bar2{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.verdict .bar2 i{display:block;height:100%;border-radius:9px}
.stars{letter-spacing:-2px;font-size:11px}
.lvl.retry{background:#f59e0b;color:#fff}
.kpi{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.pill2{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink2);margin:2px 4px 2px 0}
ul.clean{padding-left:18px;margin:0 0 8px;color:var(--ink2)}ul.clean li{margin-bottom:4px}
</style>
</head>
<body>
<header class="top">
  <div class="row"><div class="cd" id="cd">…</div><div class="pill" id="xp">⚡ 0 XP</div></div>
  <div class="bar"><i id="pbar" style="width:0"></i></div>
  <div class="barlbl"><span id="plbl"></span><span id="streak"></span></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-v="home"><b>🏠</b>Home</button>
  <button data-v="practice"><b>🎯</b>Practice</button>
  <button data-v="mocks"><b>⏱️</b>Mocks</button>
  <button data-v="plan"><b>🗓️</b>Plan</button>
  <button data-v="colleges"><b>🎓</b>Colleges</button>
</nav>
<div id="modal"></div>

<script src="data.js"></script>
<script src="merge.js"></script>
<script src="levels.js"></script>
<script src="mocks.js"></script>
<script>
const NAME = "Priya";
const SECS = { VARC:{label:"Verbal & Reading", icon:"📖", bg:"#f1ebff"}, DILR:{label:"Data & Logic", icon:"🧩", bg:"#e0f2fe"}, QA:{label:"Quant", icon:"🔢", bg:"#fff1e6"} };
const PLAN = buildPlan();
PLAN.forEach(d => d.base = d.tasks);

// ---------- coach content (written daily by the coach agent into the Sheet's Content tab) ----------
const CKEY = "catpriya_content_v2", BASE_LEVELS = { VARC: LEVELS.VARC.length, DILR: LEVELS.DILR.length, QA: LEVELS.QA.length }, BASE_SETS = new Set(Object.keys(SETS));
let COACH = null;
const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";
function validQ(q) {
  if (!q || typeof q.id !== "string" || typeof q.text !== "string" || typeof q.exp !== "string") return false;
  if (q.set && !(q.set in SETS)) return false;
  if (q.type === "mcq") return Array.isArray(q.opts) && q.opts.length === 4 && q.opts.every(o => typeof o === "string") && [0, 1, 2, 3].includes(q.ans);
  return q.type === "tita" && (typeof q.ans === "string" || typeof q.ans === "number");
}
function applyContent(c) {
  if (!c || typeof c !== "object") c = {};
  Object.keys(SETS).forEach(k => { if (!BASE_SETS.has(k)) delete SETS[k]; });
  Object.entries({ ...EXTRA.sets, ...(c.sets || {}) }).forEach(([k, v]) => { if (/^[\w-]+$/.test(k) && !BASE_SETS.has(k) && typeof v === "string") SETS[k] = v.slice(0, 6000); });
  ["VARC", "DILR", "QA"].forEach(sec => {
    LEVELS[sec].length = BASE_LEVELS[sec];
    [...(EXTRA.levels[sec] || []), ...(Array.isArray(c.levels?.[sec]) ? c.levels[sec] : [])].forEach(L => {
      if (LEVELS[sec].some(x => x.title === L?.title)) return;
      const qs = (Array.isArray(L?.qs) ? L.qs : []).filter(validQ).map(q => ({ ...q, ans: q.type === "tita" ? String(q.ans) : q.ans }));
      if (LEVELS[sec].length < 10 && qs.length === 5) LEVELS[sec].push({ title: str(L.title, 40) || "Coach Level", mins: Math.min(30, Math.max(5, +L.mins || 12)), qs });
    });
  });
  PLAN.forEach(d => { const o = c.plan?.[d.date]; d.tasks = Array.isArray(o) && o.length ? o.filter(t => typeof t === "string").slice(0, 8).map(t => t.slice(0, 300)) : d.base; });
  const k = c.coach;
  COACH = k && typeof k === "object" ? { date: str(k.date, 20), headline: str(k.headline, 120), note: str(k.note, 1500), focus: (Array.isArray(k.focus) ? k.focus : []).filter(f => typeof f === "string").slice(0, 6).map(f => f.slice(0, 200)) } : null;
}
try { applyContent(JSON.parse(localStorage.getItem(CKEY))); } catch { applyContent(null); }
async function loadContent() {
  try {
    const j = await (await fetch(API + "?action=content")).json();
    if (!j.content) return;
    const before = localStorage.getItem(CKEY), now = JSON.stringify(j.content);
    if (before === now) return;
    try { localStorage.setItem(CKEY, now); } catch {}
    applyContent(j.content); if (!Q) render();
  } catch {}
}
const KEY = "catpriya_v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- state ----------
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
S = Object.assign({ xp:0, levels:{VARC:0,DILR:0,QA:0}, tasks:{}, taskTs:{}, fixed:{}, history:[], streak:{last:null,count:0}, diag:null, lastBoost:null, imgs:{} }, S);
const save = (touch = true) => { if (touch) S.updatedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} if (touch) syncSoon(); };

// ---------- cloud sync (Google Sheet via Apps Script) ----------
const API = "https://script.google.com/macros/s/AKfycbxh9Dg2RPVrlB7ZMpeG6BRPfqlCQ7T1z7TPbdQnrhdUGWflcfqWO3MB9T-11CrpRJzUaQ/exec";
const OKEY = "catpriya_outbox_v2";
let outbox; try { outbox = JSON.parse(localStorage.getItem(OKEY)) || []; } catch { outbox = []; }
const saveOutbox = () => { try { localStorage.setItem(OKEY, JSON.stringify(outbox)); } catch {} };
function queue(ev) { ev.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); outbox.push(ev); saveOutbox(); syncSoon(); }
let syncT = null, syncing = false, stateDirty = true, restored = false;
function syncSoon() { stateDirty = true; clearTimeout(syncT); syncT = setTimeout(flush, 1500); }
async function flush() {
  if (syncing || (!outbox.length && !stateDirty)) return;
  syncing = true;
  const batch = outbox.slice(0, 15), { imgs, ...state } = S;
  try {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(restored && S.updatedAt ? { v: 2, events: batch, state, updatedAt: S.updatedAt } : { v: 2, events: batch }) });
    const j = await r.json();
    if (j.ok) { const ids = new Set(j.ids); outbox = outbox.filter(e => !ids.has(e.id)); saveOutbox(); if (restored) stateDirty = false; if (j.state) adopt(j.state); }
  } catch {}
  syncing = false;
  if (outbox.length) setTimeout(flush, 5000);
}
// Remote state is writable by anyone with the URL, so coerce every field before use.
function clean(r) {
  const N = v => Number.isFinite(+v) ? +v : 0, D = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null, SEC = v => ["VARC","DILR","QA"].includes(v) ? v : undefined;
  const sec3 = o => Object.fromEntries(["VARC","DILR","QA"].map(k => [k, { c: N(o?.[k]?.c), t: N(o?.[k]?.t), net: N(o?.[k]?.net) }]));
  return {
    xp: N(r.xp), lastBoost: D(r.lastBoost),
    levels: Object.fromEntries(["VARC","DILR","QA"].map(k => [k, Math.min(10, Math.max(0, N(r.levels?.[k])))])),
    tasks: Object.fromEntries(Object.entries(r.tasks || {}).filter(([k]) => /^\d{4}-\d{2}-\d{2}:\d+$/.test(k)).map(([k, v]) => [k, !!v])),
    taskTs: Object.fromEntries(Object.entries(r.taskTs || {}).filter(([k]) => /^\d{4}-\d{2}-\d{2}:\d+$/.test(k)).map(([k, v]) => [k, N(v)])),
    updatedAt: N(r.updatedAt),
    streak: { last: D(r.streak?.last), count: N(r.streak?.count) },
    diag: r.diag ? { at: N(r.diag.at), net: N(r.diag.net), c: N(r.diag.c), pct: N(r.diag.pct), date: D(r.diag.date), bySec: sec3(r.diag.bySec) } : null,
    history: (Array.isArray(r.history) ? r.history : []).filter(h => D(h?.date)).map(h => ({ id: String(h.id || "").replace(/\W/g, "") || undefined, at: N(h.at), date: h.date, kind: ["diag","level","mock","sectional","full","drill"].includes(h.kind) ? h.kind : "mock", sec: SEC(h.sec), level: N(h.level), c: N(h.c), t: N(h.t), net: N(h.net), secs: N(h.secs), pass: !!h.pass, pct: N(h.pct), timeout: !!h.timeout, retry: !!h.retry, attemptNo: N(h.attemptNo), mock: String(h.mock || "").replace(/\W/g, "") || undefined, wrong: String(h.wrong || "").replace(/[^\w,]/g, ""), skipped: String(h.skipped || "").replace(/[^\w,]/g, "") })),
    fixed: Object.fromEntries(Object.entries(r.fixed || {}).filter(([k]) => /^\w+$/.test(k)).map(([k, v]) => [k, N(v)])),
  };
}
// Merge the cloud copy into this device's copy; push back if this device had anything the cloud lacked.
function adopt(remote) {
  const r = clean(remote), mine = clean(S), merged = mergeState(mine, r), imgs = S.imgs;
  const changedHere = JSON.stringify(merged) !== JSON.stringify(mergeState(r, r));
  const changedForMe = JSON.stringify(merged) !== JSON.stringify(mergeState(mine, mine));
  S = Object.assign({}, S, merged, { imgs });
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
  if (changedForMe && !Q) render();
  return changedHere;
}
async function restore() {
  try {
    const j = await (await fetch(API + "?action=state")).json();
    const pushBack = j.state ? adopt(j.state) : true;
    restored = true;
    if (pushBack && (S.diag || S.history.length || Object.keys(S.tasks).length)) syncSoon();
  } catch { setTimeout(restore, 30000); }
}
setInterval(flush, 60000);
setInterval(() => { if (document.visibilityState === "visible") restore(); }, 60000);
addEventListener("online", flush);
addEventListener("focus", restore);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") restore(); else flush(); });
const todayIST = () => new Date(Date.now() + 19800000).toISOString().slice(0, 10);
function bumpStreak() {
  const t = todayIST(); if (S.streak.last === t) return;
  const y = new Date(Date.now() + 19800000 - 864e5).toISOString().slice(0, 10);
  S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1; S.streak.last = t; save();
}

// ---------- header countdown ----------
const examT = new Date(EXAM.date).getTime(), startT = new Date(EXAM.prepStart).getTime();
function tick() {
  const ms = examT - Date.now();
  let txt;
  if (ms <= 0) txt = "CAT DAY 🔥<small>you've got this</small>";
  else if (ms > 7 * 864e5) txt = `D-${Math.ceil(ms / 864e5)}<small>days to CAT</small>`;
  else if (ms > 864e5) txt = `${Math.floor(ms / 36e5)} hrs<small>to CAT</small>`;
  else { const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3); txt = `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}<small>to CAT</small>`; }
  $("#cd").innerHTML = txt;
  const pct = Math.min(100, Math.max(0, (Date.now() - startT) / (examT - startT) * 100));
  const done = Object.values(S.tasks).filter(Boolean).length, total = PLAN.reduce((a, d) => a + d.tasks.length, 0);
  $("#pbar").style.width = (done / total * 100) + "%";
  $("#plbl").textContent = `Plan ${Math.round(done / total * 100)}% done · time used ${Math.round(pct)}%`;
  $("#xp").textContent = `⚡ ${S.xp} XP`;
  $("#streak").textContent = S.streak.count ? `🔥 ${S.streak.count}-day streak` : "";
}
setInterval(tick, 1000);

// ---------- helpers ----------
const todayPlan = () => PLAN.find(d => d.date === todayIST()) || (todayIST() < PLAN[0].date ? PLAN[0] : PLAN[PLAN.length - 1]);
function estPct(net, max) { // deliberately conservative
  const r = Math.max(0, net) / max;
  return Math.max(20, Math.floor((25 + r * 50) / 5) * 5);
}
function allQs() { const out = []; for (const sec in LEVELS) LEVELS[sec].forEach(l => l.qs.forEach(q => out.push({ ...q, sec }))); return out; }
function norm(s) { return String(s).replace(/[\s,]/g, "").toLowerCase(); }
function isRight(q, a) { if (a == null || a === "") return null; return q.type === "mcq" ? a === q.ans : norm(a) === norm(q.ans); }
function marks(q, a) { const r = isRight(q, a); return r === null ? 0 : r ? 3 : (q.type === "mcq" ? -1 : 0); }
function popXP(t) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function levelName(n) { return ["Starter","Explorer","Climber","Builder","Challenger","Contender","Achiever","Ranker","Topper","IIM-ready","Legend"][Math.min(n, 10)]; }

// campus images from Wikipedia (first real photo, not logo)
async function campusImg(c) {
  if (S.imgs[c.wiki] !== undefined) return S.imgs[c.wiki];
  let src = null;
  try {
    const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/" + encodeURIComponent(c.wiki.replace(/ /g, "_")));
    const j = await r.json();
    const imgs = (j.items || []).filter(i => i.type === "image" && !/logo|seal|emblem|\.svg|map|flag|icon|signature|anniversary|portrait/i.test(i.title));
    const it = imgs.find(i => /campus|building|gate|aerial|view|lake|hall|block|library|entrance/i.test(i.title)) || imgs[0];
    if (it && it.srcset && it.srcset.length) src = "https:" + it.srcset[it.srcset.length - 1].src.replace(/^https?:/, "");

// ---------- honest analytics: mastery, mistakes, pace ----------
const PACE = { VARC: 100, DILR: 109, QA: 109 }; // CAT seconds per question (40 min / questions)
function qIndex() { const m = {}; DIAGNOSTIC.forEach(q => m[q.id] = q);
  for (const sec in LEVELS) LEVELS[sec].forEach(L => L.qs.forEach(q => m[q.id] = { ...q, sec }));
  if (typeof MOCKS !== "undefined") Object.values(MOCKS.qs).forEach(q => m[q.id] = q);
  return m; }
// First attempt at each level decides mastery; retries only "clear" it.
function levelStats() {
  const out = { VARC: {}, DILR: {}, QA: {} };
  S.history.filter(h => h.kind === "level" && out[h.sec]).forEach(h => { const L = out[h.sec][h.level] = out[h.sec][h.level] || { tries: 0 };
    L.tries++; if (L.tries === 1) { L.first = !!h.pass; L.c = h.c; L.t = h.t; L.secs = h.secs; } if (h.pass && !L.passAt) L.passAt = L.tries; });
  return out;
}
function openMistakes() {
  const last = {}, idx = qIndex(), fixed = S.fixed || {};
  S.history.forEach(h => (h.wrong || "").split(",").concat((h.skipped || "").split(",")).filter(Boolean).forEach(id => { last[id] = Math.max(last[id] || 0, h.at || 0); }));
  return Object.keys(last).filter(id => idx[id] && !(fixed[id] >= last[id])).map(id => idx[id]);
}
function insights() {
  const ls = levelStats(), mist = openMistakes(), res = {};
  ["VARC","DILR","QA"].forEach(sec => { const lv = Object.values(ls[sec]);
    const firsts = lv.filter(l => l.first !== undefined), fp = firsts.filter(l => l.first).length;
    const c = firsts.reduce((a, l) => a + l.c, 0), t = firsts.reduce((a, l) => a + l.t, 0), secs = firsts.reduce((a, l) => a + l.secs, 0);
    const mocks = S.history.filter(h => (h.kind === "sectional" && h.sec === sec));
    const rate = firsts.length ? fp / firsts.length : 0;
    res[sec] = { cleared: S.levels[sec], played: firsts.length, firstPass: fp, rate, acc: t ? c / t : 0, pace: t ? Math.round(secs / t) : 0,
      mistakes: mist.filter(q => q.sec === sec).length, mock: mocks.length ? mocks[mocks.length - 1] : null,
      verdict: rate >= .67 ? ["Strong", "ok"] : rate >= .34 ? ["Building", ""] : ["Red flag", "bad"] };
  });
  return { sec: res, mistakes: mist };
}
function nextMove() {
  const I = insights(), secs = ["QA","DILR","VARC"];
  const worst = secs.slice().sort((a, b) => I.sec[a].rate - I.sec[b].rate || I.sec[b].mistakes - I.sec[a].mistakes)[0], W = I.sec[worst];
  if (W.mistakes >= 3) return { title: `Fix ${Math.min(W.mistakes, 10)} ${worst} mistakes`, why: `${worst} first-try pass rate is ${W.firstPass}/${W.played}. Passing on retry = remembering, not mastering. Prove each method on the questions you got wrong.`, cta: `Start Mistake Drill →`, act: `startQuiz('drill','${worst}')` };
  const noMock = secs.find(s => S.levels[s] >= 8 && !I.sec[s].mock && MOCKS.list.length);
  if (noMock) return { title: `Take your first ${noMock} sectional — real CAT format`, why: `You've cleared Level ${S.levels[noMock]}. Levels test methods; the sectional tests you at CAT difficulty and pace — 40 minutes, no help.`, cta: `Start ${noMock} Sectional →`, act: `startQuiz('sectional','${noMock}')` };
  const lvlSec = secs.find(s => S.levels[s] < LEVELS[s].length);
  if (lvlSec) return { title: `${lvlSec} Level ${S.levels[lvlSec] + 1} — first try or nothing`, why: `Only first-try passes earn ⭐ Mastered. Read slowly, then commit.`, cta: `Play Level ${S.levels[lvlSec] + 1} →`, act: `startQuiz('level','${lvlSec}',${S.levels[lvlSec]})` };
  return { title: `Full CAT mock — 2 hours, all three sections`, why: `Every level is done. Now train stamina and section-switching under real timing.`, cta: `Start Full Mock →`, act: `startQuiz('full')` };
}

// ---------- mocks ----------
// Rough CAT score→percentile curves (net ÷ max). Deliberately conservative: we subtract 5 at the end.
const PCT_CURVE = { VARC: [[0,25],[.10,55],[.18,70],[.24,80],[.32,90],[.40,95],[.55,99]], DILR: [[0,25],[.08,55],[.15,70],[.20,80],[.28,90],[.35,95],[.50,99]],
  QA: [[0,25],[.07,55],[.14,70],[.19,80],[.27,90],[.35,95],[.50,99]], ALL: [[0,25],[.09,55],[.16,70],[.21,80],[.29,90],[.37,95],[.50,99]] };
function mockPct(net, max, curve) {
  const r = Math.max(0, net) / max, c = PCT_CURVE[curve];
  let p = c[c.length - 1][1];
  for (let i = 1; i < c.length; i++) if (r <= c[i][0]) { const [x0, y0] = c[i - 1], [x1, y1] = c[i]; p = y0 + (y1 - y0) * (r - x0) / (x1 - x0); break; }
  return Math.max(20, Math.min(97, Math.round(p - 5)));
}
function mockQs(mock, sec) { return MOCKS.list.find(m => m.id === mock).parts[sec].map(id => MOCKS.qs[id]); }
function mocksView() {
  const m = MOCKS.list[0];
  if (!m) return `<h1>⏱️ Mocks</h1><p>Your first CAT-format mocks are being written. Check back soon.</p>`;
  const past = k => S.history.filter(h => (h.kind === "sectional" && h.sec === k) || (k === "full" && h.kind === "full"));
  const row = (k, label, mins, n) => { const p = past(k), best = p.length ? Math.max(...p.map(h => h.pct)) : null;
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${label}</h3>${best !== null ? `<span class="tag ok">best ~${best}%ile</span>` : `<span class="tag acc">not taken</span>`}</div>
    <p class="muted">${n} questions · ${mins} min · CAT marking · no hints until you submit${k === "full" ? " · sections lock after 40 min each, like the real exam" : ""}</p>
    ${p.length ? `<p class="muted" style="margin-top:-4px">Attempts: ${p.map(h => `${h.date.slice(5)} → ${h.net}/${h.t * 3} (~${h.pct}%ile)`).join(" · ")}${p.length ? " · retakes reuse the same questions, so scores rise from memory" : ""}</p>` : ""}
    <button class="btn ${p.length ? "sec" : ""}" onclick="startQuiz('${k === "full" ? "full" : "sectional"}','${k}')">${p.length ? "Retake" : "Start"} →</button></div>`; };
  return `<h1>⏱️ CAT-format mocks</h1><p>This is the real test. Questions are at actual CAT difficulty and pace — new ones you've never seen. Your percentile here is the honest one.</p>
  <div class="card" style="background:var(--acc2);border:0"><h3>How to take a mock</h3><ul class="clean" style="margin:0"><li>Quiet room, phone on silent, one sitting.</li><li>Skip freely — a wrong MCQ costs −1, a skip costs 0. TITA has no penalty: never leave it blank if you have a guess.</li><li>DILR: spend the first 3 minutes reading every set, then attack the 2 easiest.</li></ul></div>
  ${row("VARC", "📖 VARC Sectional 1", 40, m.parts.VARC.length)}${row("DILR", "🧩 DILR Sectional 1", 40, m.parts.DILR.length)}${row("QA", "🔢 QA Sectional 1", 40, m.parts.QA.length)}
  ${row("full", "🏁 Full CAT Mock 1 (all three)", 120, m.parts.VARC.length + m.parts.DILR.length + m.parts.QA.length)}
  <p class="muted">Percentiles are rough, based on past CAT score patterns, and deliberately set low.</p>`;
}

// ---------- quiz engine ----------
let Q = null, timerId = null;
function shuffleOpts(q) { const ord = [0, 1, 2, 3].sort(() => Math.random() - .5); return { ...q, opts: ord.map(i => q.opts[i]), ans: ord.indexOf(q.ans) }; }
function startQuiz(mode, sec, idx) {
  let qs, mins, title, parts = null;
  if (mode === "diag") { qs = DIAGNOSTIC; mins = 20; title = "Diagnostic"; }
  else if (mode === "level") { const L = LEVELS[sec][idx], tried = S.history.some(h => h.kind === "level" && h.sec === sec && h.level === idx + 1);
    qs = L.qs.map(q => ({ ...q, sec })).map(q => tried && q.type === "mcq" ? shuffleOpts(q) : q); mins = L.mins; title = `${sec} · Level ${idx + 1} · ${L.title}${tried ? " (retry)" : ""}`; }
  else if (mode === "drill") { const pool = openMistakes().filter(q => !sec || q.sec === sec).sort(() => Math.random() - .5).slice(0, 10);
    if (!pool.length) { alert("No open mistakes — brilliant."); return; }
    qs = pool.map(q => q.type === "mcq" ? shuffleOpts(q) : q); mins = Math.max(10, pool.length * 2); title = `Mistake Drill${sec ? " · " + sec : ""} · ${pool.length} to fix`; }
  else if (mode === "sectional") { qs = mockQs(MOCKS.list[0].id, sec); mins = 40; title = `${sec} Sectional · ${MOCKS.list[0].title}`; }
  else if (mode === "full") { const m = MOCKS.list[0]; qs = []; parts = [];
    ["VARC","DILR","QA"].forEach(s => { const a = mockQs(m.id, s); parts.push({ sec: s, from: qs.length, to: qs.length + a.length, mins: 40 }); qs = qs.concat(a); });
    mins = 40; title = `Full CAT Mock · ${m.title}`; }
  else { const pool = allQs().sort(() => Math.random() - .5); qs = ["VARC","DILR","QA"].flatMap(s => pool.filter(q => q.sec === s).slice(0, 4)); mins = 24; title = "Speed Mock"; }
  if (mode === "sectional") parts = [{ sec, from: 0, to: qs.length, mins: 40 }];
  Q = { mode, sec, idx, qs, title, parts, part: 0, i: 0, ans: {}, checked: {}, qt: {}, end: Date.now() + mins * 6e4, start: Date.now() };
  $("#nav").style.display = "none"; clearInterval(timerId); timerId = setInterval(qTick, 500); drawQ(); scrollTo(0, 0);
}
function stamp() { if (!Q) return; const now = Date.now(); if (Q.curId) Q.qt[Q.curId] = (Q.qt[Q.curId] || 0) + (now - Q.shownAt); Q.curId = Q.qs[Q.i] && Q.qs[Q.i].id; Q.shownAt = now; }
function nextPart() { stamp(); if (Q.parts && Q.part < Q.parts.length - 1) { Q.part++; Q.i = Q.parts[Q.part].from; Q.end = Date.now() + Q.parts[Q.part].mins * 6e4; drawQ(); scrollTo(0, 0); } else finishQuiz(); }
function qTick() { if (!Q) return; const ms = Q.end - Date.now(); const el = $("#timer"); if (ms <= 0) { if (Q.parts && Q.part < Q.parts.length - 1) nextPart(); else finishQuiz(true); return; } if (el) { el.textContent = `⏱ ${Math.floor(ms / 6e4)}:${String(Math.floor(ms % 6e4 / 1e3)).padStart(2, "0")}`; el.classList.toggle("low", ms < 6e4); } }
function drawQ() {
  stamp();
  const q = Q.qs[Q.i], a = Q.ans[q.id], instant = Q.mode === "level" || Q.mode === "drill", chk = Q.checked[q.id];
  const P = Q.parts ? Q.parts[Q.part] : { from: 0, to: Q.qs.length };
  const stem = q.set ? `<div class="stem">${esc(SETS[q.set] || MOCKS.sets[q.set] || "")}</div>` : "";
  let body;
  if (q.type === "mcq") body = q.opts.map((o, j) => { let c = a === j ? "sel" : ""; if (chk) c = j === q.ans ? "right" : a === j ? "wrong" : ""; return `<button class="opt ${c}" ${chk ? "disabled" : ""} onclick="pick(${j})">${"ABCD"[j]}. ${esc(o)}</button>`; }).join("");
  else body = `<input class="tita" inputmode="${/^-?\d+$/.test(q.ans) ? "numeric" : "text"}" placeholder="Type your answer" value="${a != null ? esc(a) : ""}" ${chk ? "disabled" : ""} oninput="Q.ans['${q.id}']=this.value.trim()">` + (chk ? `<p><b>Answer: ${esc(q.ans)}</b></p>` : "");
  const fb = chk ? `<div class="exp">${isRight(q, a) ? "✅ <b>Correct!</b>" : a == null || a === "" ? "⏭️ Skipped." : "❌ <b>Not quite.</b>"} ${esc(q.exp)}</div>` : "";
  const last = Q.i === P.to - 1, lastPart = !Q.parts || Q.part === Q.parts.length - 1;
  const nav = instant
    ? (chk ? `<button class="btn" onclick="${Q.i === Q.qs.length - 1 ? "finishQuiz()" : "Q.i++;drawQ()"}">${Q.i === Q.qs.length - 1 ? "See result" : "Next →"}</button>` : `<div class="row2"><button class="btn ghost" onclick="check(true)">Skip</button><button class="btn" onclick="check()">Check</button></div>`)
    : `<div class="row2"><button class="btn ghost" ${Q.i > P.from ? "" : "disabled"} onclick="Q.i--;drawQ()">← Prev</button>${last ? `<button class="btn" onclick="if(confirm('${lastPart ? "Submit now?" : "Submit this section? You cannot come back to it."}'))${lastPart ? "finishQuiz()" : "nextPart()"}">${lastPart ? "Submit" : "Submit section →"}</button>` : `<button class="btn" onclick="Q.i++;drawQ()">Next →</button>`}</div>`;
  const dots = instant ? "" : `<div class="dots">${Q.qs.slice(P.from, P.to).map((x, k) => { const j = P.from + k; return `<button class="${Q.ans[x.id] != null && Q.ans[x.id] !== "" ? "ans" : ""} ${j === Q.i ? "cur" : ""}" onclick="Q.i=${j};drawQ()">${k + 1}</button>`; }).join("")}</div>`;
  const partLbl = Q.parts && Q.parts.length > 1 ? ` · Section ${Q.part + 1}/3 ${Q.parts[Q.part].sec}` : "";
  $("#app").innerHTML = `<div class="qtop"><div><b style="font-size:13px">${esc(Q.title)}</b><div class="muted">Q ${Q.i - P.from + 1}/${P.to - P.from}${partLbl} · ${q.sec} · ${q.type === "mcq" ? "MCQ (+3/−1)" : "Type-in (+3/0)"}</div></div><div class="timer" id="timer"></div></div>
  ${stem}<div class="qtext">${esc(q.text)}</div>${body}${fb}${nav}${dots}
  <button class="btn ghost" style="margin-top:14px" onclick="if(confirm('Quit? Progress in this quiz is lost.')){quitQuiz()}">Quit</button>`;
  qTick();
}
function pick(j) { Q.ans[Q.qs[Q.i].id] = j; drawQ(); }
function check(skip) {
  const q = Q.qs[Q.i]; if (skip) delete Q.ans[q.id]; Q.checked[q.id] = true;
  if (isRight(q, Q.ans[q.id])) { S.xp += 10; popXP("+10 ⚡"); if (Q.mode === "drill") { S.fixed = S.fixed || {}; S.fixed[q.id] = Date.now(); } save(); }
  drawQ();
}
function quitQuiz() { clearInterval(timerId); Q = null; $("#nav").style.display = "flex"; render(); }
function finishQuiz(timeout) {
  stamp(); clearInterval(timerId); const q = Q; Q = null;
  let c = 0, net = 0; const bySec = {}; const wrong = [], skipped = [];
  q.qs.forEach(x => { const a = q.ans[x.id], r = isRight(x, a); bySec[x.sec] = bySec[x.sec] || { c: 0, t: 0, net: 0, w: 0, neg: 0, s: 0, time: 0 }; const B = bySec[x.sec]; B.t++; if (a != null && a !== "") { B.at = (B.at || 0) + 1; B.time += (q.qt[x.id] || 0) / 1000; }
    if (r) { c++; B.c++; } else if (r === false) { wrong.push(x.id); B.w++; if (x.type === "mcq") B.neg++; } else { skipped.push(x.id); B.s++; } const m = marks(x, a); net += m; B.net += m; });
  const secs = Math.round((Date.now() - q.start) / 1000), max = q.qs.length * 3;
  const priorLevel = q.mode === "level" && S.history.some(h => h.kind === "level" && h.sec === q.sec && h.level === q.idx + 1);
  const rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: Date.now(), date: todayIST(), kind: q.mode, sec: q.sec, level: q.idx + 1, c, t: q.qs.length, net, secs, wrong: wrong.join(","), skipped: q.mode === "diag" ? skipped.join(",") : "" }; // mock skips are strategy, not mistakes
  bumpStreak();
  let head = "", extra = "";
  const paceLine = s => { const B = bySec[s]; if (!B.at) return "no questions attempted"; const per = Math.round(B.time / B.at); return `${per}s per question · CAT pace ${PACE[s]}s ${per > PACE[s] * 1.15 ? "— too slow, speed is now the gap" : per < PACE[s] * .5 && B.c < B.at ? "— rushing, slow down and read" : "— on pace"}`; };
  if (q.mode === "diag") {
    const pct = estPct(net, max); ["VARC","DILR","QA"].forEach(s => bySec[s] = bySec[s] || { c: 0, t: 0, net: 0 });
    S.diag = { at: Date.now(), net, c, pct, bySec, date: rec.date }; S.xp += c * 10;
    head = `<div class="center"><div style="font-size:44px">🧭</div><h1>Your starting point</h1><p>Estimated percentile today</p><div class="big" style="color:var(--acc)">~${pct}</div><p class="muted" style="margin-top:6px">${c}/10 correct · net score ${net}/30</p></div>`;
    extra = `<div class="card"><h3>Section by section</h3>${["VARC","DILR","QA"].map(s => { const b = bySec[s], r = b.t ? b.c / b.t : 0; return `<div class="task"><span style="flex:1">${SECS[s].icon} <b>${s}</b> — ${b.c}/${b.t}</span><span class="tag ${r >= .75 ? "ok" : r >= .5 ? "" : "bad"}">${r >= .75 ? "Strength" : r >= .5 ? "Developing" : "Focus area"}</span></div>`; }).join("")}</div>`;
  } else if (q.mode === "level") {
    const pass = c >= 4; rec.pass = pass; rec.retry = priorLevel;
    if (pass && S.levels[q.sec] < q.idx + 1) { S.levels[q.sec] = q.idx + 1; S.xp += priorLevel ? 20 : 80; }
    const badge = pass ? (priorLevel ? "✓ Cleared on retry — not yet mastered" : "⭐ MASTERED — first try!") : "";
    head = `<div class="center"><div style="font-size:52px">${pass ? (priorLevel ? "✅" : "🌟") : "💪"}</div><h1>${pass ? `Level ${q.idx + 1} cleared` : "Not yet — and that's data"}</h1><p>${c}/5 correct${timeout ? " · time ran out" : ""} · ${paceLine(q.sec)}</p>${pass ? `<p><b>${badge}</b>${priorLevel ? "<br><span class='muted'>Retries reuse questions, so memory helps. The wrong ones go to your Mistake Bank — fixing them proves the method.</span>" : " +80 XP"}</p>` : `<p>Read every explanation below, then do the Mistake Drill before retrying. Retrying straight away tests memory, not method.</p>`}</div>`;
    extra = `<h2>What went wrong</h2>` + (q.qs.filter(x => isRight(x, q.ans[x.id]) !== true).map(x => `<div class="card"><div class="qtext">${esc(x.text)}</div><p><b>Answer:</b> ${x.type === "mcq" ? esc(x.opts[x.ans]) : esc(x.ans)}</p><div class="exp">${esc(x.exp)}</div></div>`).join("") || `<p class="muted">Nothing. Clean sweep.</p>`);
  } else if (q.mode === "drill") {
    head = `<div class="center"><div style="font-size:48px">🔁</div><h1>${c}/${q.qs.length} fixed</h1><p>${c === q.qs.length ? "Every one of them. That's mastery, not memory." : `${q.qs.length - c} still open — they'll come back in your next drill.`}</p><p class="muted">${openMistakes().length} mistakes left in the bank.</p></div>`;
  } else if (q.mode === "sectional" || q.mode === "full") {
    const curve = q.mode === "full" ? "ALL" : q.sec, pct = mockPct(net, max, curve); rec.pct = pct; rec.mock = MOCKS.list[0].id;
    rec.attemptNo = S.history.filter(h => h.kind === q.mode && (q.mode === "full" || h.sec === q.sec)).length + 1;
    const lost = Object.values(bySec).reduce((a, B) => a + B.neg, 0), skippedN = skipped.length, attempts = q.qs.length - skippedN, acc = attempts ? Math.round(100 * c / attempts) : 0;
    const titaBlank = q.qs.filter(x => x.type === "tita" && (q.ans[x.id] == null || q.ans[x.id] === "")).length;
    const slow = q.qs.map(x => ({ x, t: (q.qt[x.id] || 0) / 1000 })).sort((a, b) => b.t - a.t).slice(0, 3);
    const acts = [];
    if (acc < 60 && attempts > 5) acts.push(`Accuracy ${acc}% is too low to pay off. Attempt fewer, choose better — target 75%+ accuracy.`);
    if (lost >= 3) acts.push(`You lost ${lost} marks to wrong MCQs. Skip any MCQ where you can't eliminate two options.`);
    if (titaBlank) acts.push(`${titaBlank} type-in questions left blank. TITA has no negative marking — always enter your best attempt.`);
    if (slow[0] && slow[0].t > 240) acts.push(`You spent ${Math.round(slow[0].t / 60)} min on one question. Hard rule: 3 minutes, then move on.`);
    if (pct < 85) acts.push(`Next 3 days: drill the topics below, then retake a fresh mock — not this one.`);
    if (!acts.length) acts.push(`Strong mock. Next: a full mock under exam timing, 8:30 am, one sitting.`);
    head = `<div class="center"><div style="font-size:44px">${pct >= 90 ? "🚀" : pct >= 75 ? "📈" : "🧭"}</div><h1>${q.mode === "full" ? "Full mock done" : q.sec + " sectional done"}</h1><div class="big" style="color:var(--acc)">~${pct}<span style="font-size:20px"> %ile</span></div><p class="muted" style="margin-top:6px">Net ${net}/${max} · ${c} right · ${wrong.length} wrong · ${skippedN} skipped · accuracy ${acc}%${rec.attemptNo > 1 ? " · retake (questions seen before)" : ""}</p><p class="muted" style="font-size:12px">Rough, deliberately conservative estimate.</p></div>`;
    extra = `<div class="card move"><h3>Do this next</h3><ul class="clean" style="color:#fff;margin:0">${acts.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
    <div class="card"><h3>By section</h3>${Object.keys(bySec).map(s => { const B = bySec[s]; return `<div class="task"><span style="flex:1"><b>${SECS[s].icon} ${s}</b> · ${B.c}/${B.t} right · ${B.w} wrong · ${B.s} skipped · net ${B.net}<br><span class="muted">${paceLine(s)}${q.mode === "full" ? ` · ~${mockPct(B.net, B.t * 3, s)}%ile` : ""}</span></span></div>`; }).join("")}</div>
    <div class="card"><h3>Where your time went</h3>${slow.map(o => `<div class="task"><span style="flex:1">${esc(o.x.text.slice(0, 70))}…</span><b>${Math.round(o.t)}s</b></div>`).join("")}</div>`;
  } else {
    const pct = estPct(net, max);
    head = `<div class="center"><div style="font-size:44px">⏱️</div><h1>Speed Mock done</h1><div class="big" style="color:var(--acc)">${net}/${max}</div><p>${c}/${q.qs.length} correct · these are practice questions you've seen before</p></div>`;
  }
  if (q.mode === "diag" || q.mode === "mock") rec.pct = estPct(net, max);
  rec.timeout = !!timeout;
  S.history.push(rec);
  queue({ type: "attempt", attempt: rec, answers: q.qs.map(x => { const a = q.ans[x.id], r = isRight(x, a);
    return { qid: x.id, sec: x.sec, type: x.type, her: a == null || a === "" ? "" : x.type === "mcq" ? "ABCD"[a] + ". " + x.opts[a] : String(a), correct: x.type === "mcq" ? "ABCD"[x.ans] + ". " + x.opts[x.ans] : x.ans, result: r ? "Right" : r === false ? "Wrong" : "Skipped", marks: marks(x, a), text: x.text.slice(0, 200), secs: Math.round((q.qt[x.id] || 0) / 1000) }; }) });
  save();
  const review = (q.mode === "level" || q.mode === "drill") ? "" : `<h2>Review every question</h2>` + q.qs.map((x, j) => { const a = q.ans[x.id], r = isRight(x, a); return `<details class="card"><summary><b>Q${j + 1}</b> ${r ? "✅" : r === false ? "❌" : "⏭️"} <span class="muted">${x.sec} · ${Math.round((q.qt[x.id] || 0) / 1000)}s</span></summary>${x.set ? `<div class="stem">${esc(SETS[x.set] || MOCKS.sets[x.set] || "")}</div>` : ""}<div class="qtext" style="margin-top:8px">${esc(x.text)}</div><p><b>Correct:</b> ${x.type === "mcq" ? esc(x.opts[x.ans]) : esc(x.ans)}${a != null && a !== "" && !r ? ` · <b>You:</b> ${x.type === "mcq" ? esc(x.opts[a]) : esc(a)}` : ""}</p><div class="exp">${esc(x.exp)}</div></details>`; }).join("");

  ${q.mode === "level" && c < 4 ? `${mist ? `<button class="btn" onclick="startQuiz('drill','${q.sec}')">Fix these in a Mistake Drill first →</button><div style="height:8px"></div>` : ""}<button class="btn ${mist ? "ghost" : ""}" onclick="startQuiz('level','${q.sec}',${q.idx})">Retry Level ${q.idx + 1}</button><div style="height:8px"></div>` : ""}
  ${q.mode === "level" && c >= 4 && q.idx + 1 < LEVELS[q.sec].length ? `<button class="btn" onclick="startQuiz('level','${q.sec}',${q.idx + 1})">Play Level ${q.idx + 2} →</button><div style="height:8px"></div>` : ""}
  <button class="btn sec" onclick="go('${q.mode === "diag" ? "colleges" : "home"}')">${q.mode === "diag" ? "See where you're headed 🎓" : "Back home"}</button>${review}`;
  scrollTo(0, 0); tick();
}

// ---------- morning pop-up ----------
function morning() {
  if (!S.diag || S.lastBoost === todayIST()) return;
  S.lastBoost = todayIST(); save();
  const d = todayPlan(), ci = d.n % COLLEGES.length, c = COLLEGES[ci], ms = examT - Date.now();
  $("#modal").innerHTML = `<div class="modal" onclick="if(event.target===this)this.remove()"><div class="sheet">
  <p class="muted" style="margin:0">${fmtDate(d.date)} · Day ${d.n}</p><h1>Rise and shine, ${NAME} ☀️</h1>
  <div class="card hero center"><div class="big">${ms > 7 * 864e5 ? Math.ceil(ms / 864e5) + " days" : Math.floor(ms / 36e5) + " hours"}</div><p style="margin:4px 0 0">until CAT 2026 — every one of them counts</p></div>
  <div class="card"><h3>Today's headline</h3><p style="margin:0">${esc(d.tasks[0])}</p></div>
  <div class="card"><h3>🎓 Campus of the day: ${esc(c.name)}</h3><div class="campus" data-img="${ci}">🎓 ${esc(c.name)}</div><p style="margin:0">${esc(c.wow)}</p></div>
  <div class="card" style="background:var(--acc2);border:0"><p style="margin:0">💬 ${esc(BOOSTS[(d.n + 3) % BOOSTS.length])}</p></div>
  <button class="btn" onclick="this.closest('.modal').remove()">Let's go 🚀</button></div></div>`;
  fillImgs();
}

go("home"); tick(); morning();
loadContent(); setInterval(() => { if (document.visibilityState === "visible") loadContent(); }, 300000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadContent(); });
queue({ type: "open", detail: navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 120) });
restore();
